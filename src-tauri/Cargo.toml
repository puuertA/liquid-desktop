[package]
name = "liquid-desktop"
version = "0.5.2"
edition = "2021"
description = "Native Windows desktop glass experiment"
license = "MIT"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
windows-registry = "0.6"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
base64 = "0.22"
sysinfo = { version = "0.37.2", default-features = false, features = ["system", "network"] }
windows = { version = "0.61", features = ["Foundation", "Media_Control", "Storage_Streams", "Win32_Foundation", "Win32_System_Com", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_System_WinRT", "Win32_UI_Shell", "Win32_Media_Audio", "Win32_Media_Audio_Endpoints"] }
